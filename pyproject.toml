[project]
name = "heatmapx"
dynamic = ["version"]
description = "Flexible, intuitive heatmap creation on NetworkX graphs"
authors = [
    { name = "drmrd" }
]
license = { text = "BSD-3-Clause" }
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "networkx>=2.8.0,<3.0.0",
]

[dependency-groups]
test = [
    "hypothesis>=6.151.9",
    "hypothesis-networkx>=0.3.0",
    "pytest>=8.0.0",
]
dev = [
    "geocoder>=1.38.1,<2.0.0",
    "geopandas>=1.1.2,<2.0.0",
    "gitpython>=3.1.29,<4.0.0",
    "ipython>=8.10.0,<9.0.0",
    "jupyterlab>=4.4.8,<5.0.0",
    "matplotlib>=3.1.0,<4.0.0",
    "osmnx>=1.8.1,<2.0.0",
    "scikit-learn>=1.5.0,<2.0.0",
    "scipy-stubs~=1.15.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
